apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app
spec:
  replicas: 6
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
      - name: go-app
        image: stunning1/podpulse:1.0
        ports:
        - containerPort: 3000